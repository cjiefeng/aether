# Aether: LAN-only. Never port-forward 8080 on your router or put it behind a public tunnel.
# Secrets are interpolated from .env (mode 0600) and passed only to the service that needs them.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  worker:
    <<: *hardening
    build:
      context: .
      target: runtime
    image: aether:local
    command: ["python", "-m", "aether.worker"]
    environment:
      AETHER_DB_PATH: /data/aether.db
      AETHER_LOG_LEVEL: ${AETHER_LOG_LEVEL:-INFO}
      # M11: one JSON object per line (`docker compose logs worker | jq`); `text` for the old format.
      AETHER_LOG_FORMAT: ${AETHER_LOG_FORMAT:-json}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      # Root FS is read-only; library caches (yfinance) go to the /tmp tmpfs.
      XDG_CACHE_HOME: /tmp/cache
      DAILY_LLM_BUDGET_USD: ${DAILY_LLM_BUDGET_USD:-5.00}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-claude-sonnet-5-5}
      SYNTH_MODEL: ${SYNTH_MODEL:-}
      # M6: research runs (web search). The 12-month backfill runs once, automatically, when an
      # API key is set (owner decision 2026-10-05); RESEARCH_BACKFILL=false turns it off.
      RESEARCH_MODEL: ${RESEARCH_MODEL:-claude-opus-5-5}
      RESEARCH_BACKFILL: ${RESEARCH_BACKFILL:-true}
      # M11: escalations (alert + verification research + re-synthesis) per SGT day.
      MAX_ESCALATIONS_PER_DAY: ${MAX_ESCALATIONS_PER_DAY:-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # S8 (optional): Tiger Brokers read-only holdings sync. The key can trade; Aether only reads.
      TIGER_ID: ${TIGER_ID:-}
      TIGER_PRIVATE_KEY: ${TIGER_PRIVATE_KEY:-}
      TIGER_ACCOUNT: ${TIGER_ACCOUNT:-}
    volumes:
      - aether-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "aether.healthcheck", "worker"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s

  app:
    <<: *hardening
    image: aether:local
    command: ["python", "-m", "aether.web"]
    environment:
      AETHER_DB_PATH: /data/aether.db
      AETHER_BIND: 0.0.0.0:8082
      AETHER_LOG_LEVEL: ${AETHER_LOG_LEVEL:-INFO}
      AETHER_LOG_FORMAT: ${AETHER_LOG_FORMAT:-json}
      AETHER_CSRF_SECRET: ${AETHER_CSRF_SECRET:-}
      # S2 (M5): the app refuses to start without both (`make hash-password`).
      AETHER_DASHBOARD_PASSWORD_HASH: ${AETHER_DASHBOARD_PASSWORD_HASH:-}
      AETHER_SESSION_SECRET: ${AETHER_SESSION_SECRET:-}
      # Display only (News page spend card); the worker enforces it.
      DAILY_LLM_BUDGET_USD: ${DAILY_LLM_BUDGET_USD:-5.00}
      MAX_ESCALATIONS_PER_DAY: ${MAX_ESCALATIONS_PER_DAY:-5}
    ports:
      - "8080:8082"
    # rw at the filesystem level so the WAL reader can map -shm; the SQLite connection itself is mode=ro.
    volumes:
      - aether-data:/data
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "aether.healthcheck", "app"]
      interval: 15s
      timeout: 15s
      retries: 5

  # Tooling container (make test/lint/fmt/lock). Nothing is installed on the host.
  dev:
    profiles: [tools]
    build:
      context: .
      target: dev
    image: aether-dev:local
    working_dir: /src
    volumes:
      - .:/src
      - aether-venv:/opt/venv
      - aether-uv-cache:/root/.cache/uv

volumes:
  aether-data:
  aether-venv:
  aether-uv-cache:
