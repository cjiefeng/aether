# CLI use: `make migrate`. The DB path comes from AETHER_DB_PATH (see migrations/env.py).
[alembic]
script_location = aether.db:migrations
prepend_sys_path = src

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
