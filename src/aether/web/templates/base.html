<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <title>{% block title %}Aether{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body hx-headers='{{ {"X-CSRF-Token": csrf_token}|tojson }}'>
  <header class="top">
    <a class="brand" href="/">Aether</a>
    <nav><a href="/">Overview</a> <a href="/health">Health</a></nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="disclaimer">{{ disclaimer }}</footer>
</body>
</html>
