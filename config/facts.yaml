  - id: pqc_deadlines
    claim: "NIST IR 8547 (initial public draft, Nov 2024): quantum-vulnerable RSA/ECDSA/ECDH/DH at 112-bit strength deprecated after 2030, all quantum-vulnerable public-key algorithms disallowed after 2035. EU coordinated PQC roadmap (v1.1, June 2025): high-risk use cases transitioned no later than end-2030; as many systems as feasible (medium-risk) by end-2035"
    sources:
      - https://nvlpubs.nist.gov/nistpubs/ir/2024/NIST.IR.8547.ipd.pdf
      - https://digital-strategy.ec.europa.eu/en/library/coordinated-implementation-roadmap-transition-post-quantum-cryptography
      - https://insidedeeptech.com/how-many-qubits-to-break-rsa-2048/
    retrieved_at: "2026-10-04"
    status: signed_off
    notes: "Refined from the seed: the NIST 2030 'deprecated' date applies only to 112-bit security strength (>=128-bit goes straight to 'disallowed after 2035'), and NIST IR 8547 is still a draft on the CSRC page. EU wording checked in the roadmap PDF linked from the Commission page."
