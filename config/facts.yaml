facts:
  - id: ionq_revenue_fy2025_guidance_2026
    claim: "IonQ FY2025 revenue $130.0M (8-K Ex. 99.1, 2026-02-25); FY2026 revenue guidance raised to $280-290M, midpoint $285M, in the Q2-26 results (8-K Ex. 99.1, 2026-08-05)"
    sources:
      - https://www.sec.gov/Archives/edgar/data/1824920/000119312526071520/ionq-ex99_1.htm
      - https://www.sec.gov/Archives/edgar/data/1824920/000119312526335040/ionq-ex99_1.htm
      - https://gp.advalorem.io/insights/2026-04-28.html
      - https://247wallst.com/investing/2026/09/30/one-year-later-only-one-quantum-stock-call-paid-off-heres-what-changed/
    retrieved_at: "2026-10-04"
    status: signed_off
    notes: "Matches the seed. Both figures are company press releases furnished on 8-K (Item 2.02), not audited filings; the FY2025 10-K (2026-02-25) is the audited source. The Q2-26 release says the outlook excludes any SkyWater contribution."

  - id: ionq_acquire_skywater
