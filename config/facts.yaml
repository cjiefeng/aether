    sources:
      - https://www.sec.gov/Archives/edgar/data/1824920/000119312526021616/d10479d8k.htm
      - https://www.sec.gov/Archives/edgar/data/1824920/000119312526335040/ionq-ex99_1.htm
      - https://gp.advalorem.io/insights/2026-04-28.html
    retrieved_at: "2026-10-04"
    status: verified_by_claude
    notes: "Agreement verified on the 8-K. Closing is stated in IonQ's own release; the closing date itself was not checked against a closing 8-K."
    open_question: "SkyWater closing date and final consideration: confirm on IonQ's closing 8-K (Item 2.01)."

  - id: qnt_ipo
    claim: "Quantinuum Inc. Class A common stock listed on Nasdaq as QNT; final prospectus dated 2026-06-03; 28,000,000 Class A shares at $60.00; Honeywell Entities to hold about 47.8% of combined voting power after the offering (47.0% if the underwriters' option is exercised in full)"
    sources:
      - https://www.sec.gov/Archives/edgar/data/2110105/000162828026041003/quantinuum-424b4.htm
      - https://thequantuminsider.com/2026/06/02/quantinuum-expands-ipo-as-valuation-climbs-above-14-billion/
    retrieved_at: "2026-10-04"
    status: signed_off
    notes: "Corrected from the seed. DISCREPANCY: the seed's Honeywell voting power (about 49.1%) differs from the 424B4 (47.8% / 47.0%). The seed's ~$14.3B market cap 'at top of range' predates pricing and is not stated in the 424B4, so it was dropped from the claim."

  - id: qnt_lockup_expiry
    claim: "QNT IPO lock-up: 180 days after the 2026-06-03 prospectus, i.e. ends 2026-11-30; J.P. Morgan and Morgan Stanley may release locked-up shares early at their discretion"
    sources:
      - https://www.sec.gov/Archives/edgar/data/2110105/000162828026041003/quantinuum-424b4.htm
    retrieved_at: "2026-10-04"
    status: verified_by_claude
    notes: "Extracted deterministically from the 424B4 text by `edgar.text.extract_lockup` (test fixture: recorded 424B4). Day count: 2026-06-03 + 180 days = 2026-11-30. Lock-ups usually end at the open of the next trading day; check the exact first-sale date before relying on it."
    open_question: "Exact first trading day locked-up QNT shares can be sold (2026-11-30 or 2026-12-01), and any early release announced by the underwriters."

  - id: infq_listing
