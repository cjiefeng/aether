# LLM prices and research parameters (M6). Numbers and identifiers only (the model forbids unknown
# keys). Prices: USD per million tokens, Anthropic first-party list prices checked 2026-10-05
# (claude-api reference, cached 2026-09-25); web search $10 per 1,000 searches (web-search tool docs).
# A model missing here is refused by the LLM wrapper: its cost couldn't be computed.
prices:
  claude-opus-5-5:   {input: "4.00", output: "20.00", cache_write: "5.00",  cache_read: "0.20"}
  claude-opus-5:     {input: "5.00", output: "25.00", cache_write: "6.25",  cache_read: "0.50"}
  claude-opus-4-8:   {input: "5.00", output: "25.00", cache_write: "6.25",  cache_read: "0.50"}
  claude-sonnet-5-5: {input: "2.00", output: "10.00", cache_write: "2.50",  cache_read: "0.20"}
  claude-sonnet-5:   {input: "2.00", output: "10.00", cache_write: "2.50",  cache_read: "0.20"}
  claude-haiku-4-5:  {input: "1.00", output: "5.00",  cache_write: "1.25",  cache_read: "0.10"}
web_search_per_1k: "10.00"
batch_discount: "0.5"          # Message Batches: tokens at 50%; searches at the normal price
budget_alert_fraction: "0.8"   # one llm_budget alert per day at 80% of DAILY_LLM_BUDGET_USD
chars_per_token: 3             # conservative input estimate for the budget guard

research:
  max_tokens: 4000
  effort: low                  # Opus 5.5 thinking can't be disabled; effort is the control
  sweep_max_uses: 5
  sweep_days: 3                # each sweep looks back this many days
  backfill_max_uses: 5
  backfill_months: 12
  est_input_tokens_per_search: 6000
  est_base_input_tokens: 3000

# Classifier (M7). No tools, ever (S1). Structured JSON output; effort low (Sonnet 5.5 thinking
# stays on adaptively). A backlog larger than batch_threshold goes to one Message Batch (50%),
# outside the daily soft budget (owner decision 2026-10-05), at most batch_max_items per batch.
classify:
  max_tokens: 4000
  effort: low
  batch_threshold: 25
  batch_max_items: 2000
  max_attempts: 2              # an invalid answer is retried once, then the item is `failed`
  max_per_run: 60              # synchronous calls per job run

# Conclusions (M10, SYNTH_MODEL, default Opus 5.5). No tools, ever (S1). Structured JSON output.
# Opus 5.5 thinking can't be disabled; effort is the control. An answer that fails validation
# (schema, unknown or quarantined citations, a thesis point without evidence) is retried once.
synthesis:
  max_tokens: 16000
  effort: high
  max_attempts: 2

# Escalation (spec §5.2.5; M11, tightened in M13). RISK events only: post-cap materiality >=
# min_materiality, or >= severe_min_materiality in a severe category. delisting_or_compliance counts
# only when the M5 overlay parser reads the filing as a listing-deficiency notice (8-K 3.01) or a
# removal of the common stock (Form 25/15); dilution only when the parsed offering is at least
# large_dilution_pct of fully diluted shares. Actions: one notification, a verification search only
# when the event has no T1 source, and a re-synthesis. Caps: MAX_ESCALATIONS_PER_DAY (env, default
# 2) per SGT day, one per ticker per cooldown_hours, and ESCALATION_DAILY_BUDGET_USD (env, default
# 1.50) for escalation calls. Quarantined events never escalate.
escalation:
  min_materiality: 5
  severe_min_materiality: 4
  severe_categories: [going_concern, short_report, guidance_cut, delisting_or_compliance, dilution]
  large_dilution_pct: 0.10
  cooldown_hours: 72
  verify_max_uses: 3
  verify_window_days: 7
