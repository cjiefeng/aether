# Backtest lab + risk-profile model strategies (spec §6.5, M4). Numbers only (the model forbids
# unknown keys). Initial values for owner review. Nothing here is sent to an LLM.

backtest:
  # Trailing sessions used to estimate weights; also the in-sample warm-up. Metrics cover only
  # the out-of-sample sessions after the first window.
  estimation_window: 120
  # A pure-play joins the sleeve once it has this many daily returns before the decision day.
  min_sessions: 60
  # Trading cost in basis points per unit of turnover (sum of |weight change|).
  cost_bps: 10
  rebalance: monthly
  # core_momentum: trailing return over this many sessions (about 6 months); top N, equal weight.
  momentum_lookback: 126
  momentum_top_n: 3
  # core_min_var: projected-gradient iterations (numpy only, no scipy).
  min_var_iterations: 2000
  # Sessions per year for annualising.
  annualization: 252

# Universe: QTUM + the pure-plays. No cash or T-bill sleeve (spec §1.4): the family-fund sleeve
# stays fully invested. Risk appetite is the FIXED QTUM weight per profile, set by the owner; the
# backtest picks only the sleeve method. Sleeve weight the per-name caps can't place goes to QTUM.
# The mandate accepts a 100% drawdown, so volatility/drawdown limits are null (shown, not
# enforced). Set a number to enforce one, relative to QTUM's out-of-sample result.
profiles:
  safe:
    qtum_weight: 0.75
    max_per_name: 0.10
    vol_limit_x: null       # e.g. 1.15 = annualised volatility <= 1.15 x QTUM's
    max_dd_limit_pp: null   # e.g. 5 = max drawdown <= QTUM's + 5 percentage points
    rank_metric: cvar95_low
  medium:
    qtum_weight: 0.45
    max_per_name: 0.20
    vol_limit_x: null
    max_dd_limit_pp: null
    rank_metric: sortino_high
  aggressive:
    qtum_weight: 0.15
    max_per_name: 0.35
    vol_limit_x: null
    max_dd_limit_pp: null
    rank_metric: sortino_high

# Rebalance planner (spec §6.6, M5). A holding trades only if its drift is >= 3 pp or >= 25% of
# its target weight, and the trade is at least min_trade_usd.
rebalance:
  drift_abs: 0.03
  drift_rel: 0.25
  min_trade_usd: 100

# Targets are published monthly (1st, 10:30 SGT) or when the owner presses "Publish targets now".
publish:
  # An event at or above this materiality on a pure-play sends an off-cycle review alert.
  off_cycle_min_materiality: 4

# Research overlay, layer 1: filing hard rules (spec §6.6.1). Each sets the name's weight to 0:
# - going concern in the latest 10-K/10-Q;
# - an 8-K Item 3.01 whose text is a listing-DEFICIENCY notice (voluntary exchange transfers
#   don't count), for compliance_notice_days;
# - a Form 25/25-NSE/15-12B/15-12G covering the COMMON STOCK (warrant, unit and note delistings
#   don't count) once the stock has stopped trading for delisted_stale_sessions QTUM sessions.
# M9 haircuts (multiplicative; both together = x 0.25):
# - fully diluted shares (common + warrants + options + unvested RSUs + convertible shares, XBRL)
#   up more than dilution_yoy_max year on year -> x dilution_multiplier. The year-ago count must
#   be dated on or after the stock's first trading session (no SPAC / pre-IPO baselines);
# - cash runway (cash + short-term investments / quarterly operating burn) under
#   runway_min_months -> x runway_multiplier.
# Freed weight goes to the other pure-plays within caps, then QTUM. (8-K Item 5.01 only alerts.)
overlay:
  enabled: true
  compliance_notice_days: 180
  delisted_stale_sessions: 10
  # Accession numbers you've reviewed and cleared (e.g. a Form 25 for an exchange transfer).
  cleared_accessions: []
  dilution_yoy_max: 0.20
  dilution_multiplier: 0.5
  runway_min_months: 12
  runway_multiplier: 0.5
