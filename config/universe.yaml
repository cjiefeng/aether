# Monthly universe review (spec §6.7, M12). Numbers and identifiers only (unknown keys are
# rejected). Initial values for owner review.

# Criterion 1: US listing. Exchange names as in SEC's company_tickers_exchange.json (checked
# 2026-10-08: NYSE, Nasdaq, CBOE, OTC; NYSE American is listed as NYSE).
exchanges: [NYSE, Nasdaq]

# Criterion 3: size and liquidity (computed in code: latest close x XBRL shares outstanding;
# median close x volume over the last N sessions).
min_market_cap_usd: "500000000"
min_median_dollar_volume_usd: "5000000"
liquidity_sessions: 20

# Criterion 4: history (else `watch`).
min_sessions: 60

# Removal: criterion 3 fails in this many consecutive monthly reviews.
remove_after_failed_reviews: 3

# Discovery: SEC EDGAR full-text search over the last N months (efts.sec.gov). Phrases are
# matched exactly. "quantum computing company" returned 33 filings on 2026-10-08.
fts_queries:
  - '"quantum computing company"'
fts_forms: ["10-K", "20-F", "S-1", "F-1", "S-4", "424B4"]
fts_lookback_months: 13
# SEC SIC codes never treated as candidates: 6770 = blank checks (SPACs). A SPAC's quantum target
# is found through its own filings or the IPO/SPAC research sweep.
excluded_sics: ["6770"]

# Criterion 2 evidence: the business section of the latest 10-K / 20-F / S-1 / F-1 / S-4 / 424B4.
# Candidates found only through QTUM holdings are screened out before any LLM spend when the
# keyword isn't in the first business_scan_chars. The stored T1 excerpt is the section's opening
# (or, if that doesn't mention the keyword, the sentence that first does).
business_scan_chars: 6000
business_excerpt_chars: 600
business_keyword: quantum
max_business_fetches: 120

# Deep research (RESEARCH_DEEP_MODEL with web search; current pure-plays first).
max_research_candidates: 12
research_max_uses: 5
sweep_max_uses: 5
research_lookback_days: 365
research_max_tokens: 4000
research_effort: low

# Proposal call (same model, no tools, structured JSON).
proposal_max_tokens: 16000
proposal_effort: high
proposal_max_attempts: 2
max_evidence_per_candidate: 12

stale_running_hours: 3

# ---- M14 (spec §1.2, §6.7.1-§6.7.3)
# At most this many active pure_play + adjacent names besides QTUM (the watchlist loader refuses
# more; the review never proposes an add without a free slot).
max_names_ex_qtum: 9

# Market-cap buckets: one input, never decisive. small (< $2B) is flagged for volatility,
# liquidity and dilution risk; large (> $50B) for diluted quantum exposure.
mcap_buckets:
  small_below_usd: "2000000000"
  large_above_usd: "50000000000"

# §6.7.2: a `remove` for any active name needs, since the previous review, a RISK event at or above
# min_materiality backed by a T1 source or min_independent_t2 independent T2 sources, an overlay
# hard rule zeroing the name, or an AVOID stance accepted by hysteresis.
removal:
  min_materiality: 4
  min_independent_t2: 2

# §6.7.2: with every slot full, a candidate passing every add criterion is notified as a strong
# candidate only with high (code-validated) exposure and these evidence counts, at most once per
# cooldown_reviews reviews unless there's newer qualifying evidence.
strong_candidate:
  min_independent_sources: 2
  min_t1_sources: 1
  cooldown_reviews: 3

# §6.7.3: the owner-triggered full re-evaluation runs at most once per this many days.
full_review_cooldown_days: 7

# §6.7.1: the adjacent-industry track. Seeds are tickers from the owner's 2026-10-07 screen: inputs
# to discovery, not opinions. Exclusions are checked in code before any research: hyperscalers and
# cloud platforms, SIC 3674 (semiconductors), pure-plays and names already active.
adjacent:
  sectors:
    pqc_cyber:          {priority: 1, seeds: [NET, PANW, FTNT, ZS]}
    sensing_timing:     {priority: 1, seeds: [FEIM, LMT, NOC, RTX, HON, HONA]}
    test_measurement:   {priority: 2, seeds: [KEYS, EMR]}
    photonics_lasers:   {priority: 2, seeds: [COHR, LITE, IPGP, MKSI, LASR]}
    cryogenics_gases:   {priority: 2, seeds: [LIN, BKR]}
    telecom_networking: {priority: 2, seeds: [SKM]}
    specialty_materials: {priority: 3, seeds: []}
    end_user:           {priority: 3, seeds: [JPM, HSBC]}
  excluded_symbols: [AMZN, MSFT, GOOGL, ORCL, BABA]
  excluded_sics: ["3674"]
  evidence_lookback_days: 365
  max_research_candidates: 12
  shortlist_size: 5
